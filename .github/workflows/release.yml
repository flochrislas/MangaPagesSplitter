# Builds the deliverables and publishes a GitHub Release.
#
# Trigger: push a version tag whose number matches <version> in pom.xml, e.g.
#   git tag -a v2.3.0 -m "Release v2.3.0" && git push --follow-tags
#
# Produces (published immediately, notes taken from CHANGELOG.md):
#   - MangaPagesSplitter.jar                    (fat JAR, needs Java 17+)
#   - MangaPagesSplitter-windows-<version>.zip  (portable bundle with its own runtime)
#   - MangaPagesSplitter.bat / MangaPagesSplitter.sh (launchers for the JAR)
#
# Third-party actions are pinned to full commit SHAs (immutable) with the
# version in a trailing comment; bump the SHA and the comment together.

name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege by default: only the `release` job elevates to contents:write.
permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------- Verify
  # Gate the release on the same checks as CI, plus the tag/pom agreement, so a
  # broken or mislabelled commit can't be tagged into published artifacts.
  verify:
    name: Verify (tests, tag matches pom)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Derive version from tag and check pom.xml
        id: ver
        env:
          TAG: ${{ github.ref_name }}   # via env so the tag can't inject shell
        run: |
          version="${TAG#v}"
          pom_version="$(mvn -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "$pom_version" != "$version" ]; then
            echo "::error::pom.xml version ($pom_version) does not match tag ($TAG). Bump pom.xml before tagging."
            exit 1
          fi
          if ! grep -qE "^## \[$(printf '%s' "$version" | sed 's/\./\\./g')\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section. Move the Unreleased items before tagging."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing version $version (tag $TAG)"

      - name: Compile and test
        run: mvn -B -ntp verify "-Dexec.skip=true"

  # ------------------------------------------------------------------ Build
  build:
    name: Build JAR and Windows bundle
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Tests already ran in `verify`; this job only packages.
      - name: Build fat JAR and Windows app-image
        run: mvn -B -ntp package -DskipTests

      - name: Stage release artifacts
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/MangaPagesSplitter-$env:VERSION-jar-with-dependencies.jar" "dist/MangaPagesSplitter.jar"
          # jpackage produced a self-contained Windows app-image at
          # target/jpackage/MangaPagesSplitter/ -- ship it as a portable ZIP.
          Compress-Archive -Path "target/jpackage/MangaPagesSplitter" -DestinationPath "dist/MangaPagesSplitter-windows-$env:VERSION.zip"
          Copy-Item "scripts/MangaPagesSplitter.bat" "dist/MangaPagesSplitter.bat"
          Copy-Item "scripts/MangaPagesSplitter.sh"  "dist/MangaPagesSplitter.sh"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------- Release
  release:
    name: Publish GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job creates the Release and uploads assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # Everything between "## [<version>]" and the next "## [" heading.
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; found = (index($0, "## [" v "]") == 1); next }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release $VERSION" > release-notes.md
          fi
          echo "--- release notes ---"; cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: MangaPagesSplitter ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/MangaPagesSplitter.jar
            dist/MangaPagesSplitter-windows-${{ needs.verify.outputs.version }}.zip
            dist/MangaPagesSplitter.bat
            dist/MangaPagesSplitter.sh
          fail_on_unmatched_files: true
